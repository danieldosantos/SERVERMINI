#Official mythic mobs wiki: https://git.mythiccraft.io/mythiccraft/MythicMobs/-/wikis/home


Lerfing_Template:
  Type: SKELETON #The mob type, can be any vanilla mob. Good options for hostile to put here are are Zombie, Skeleton, Spider, Phantom, Vex, Evoker, Vindicator, Ravager, etc.
  Display: '&3Template' #The name of the mob when the player looks at it while close by. Name this anything you want. &3 is there to make the name a green color. Search up bukkit color code list if this confuses you.
  Health: 50 #Hit points of your mob
  Damage: 7 #Melee attack power of your mob. Does not affect bows. 
  Faction: Template #Faction of the mob, allows it to attack and target other factions of mobs. More advanced feature and not included in this.
  Equipment: #What the mob has. Enchantments can change based on what they have
  - netherite_sword HAND
  - shield OFFHAND
  - netherite_helmet HEAD
  - diamond_chestplate CHEST
  - iron_leggings LEGS
  - leather_boots FEET
  Options:
    MovementSpeed: 0.2 #How fast the mob moves. Values over 0.2 or higher make them faster than default vanilla. Under 0.2 makes them slower.
    MaxCombatDistance: 128 #How far the mob can be attacked from in blocks and still take damage. Used to prevent cheesing with bows outside of aggro range
    FollowRange: 16 #How far the mob can aggro onto the player. 16 is default, recommended for bosses to turn this up higher.
    KnockbackResistance: 0 #Chance for the mob to resist getting knocked back when attacked. 1 is 100% knockback immunity, 0.5 is a 50% chance to avoid knockback.
    Invisible: false #Should the mob spawn invisible? Sometimes doesn't work right. Use the potion invisibility skill on spawn if you find this not working.
    Despawn: true #Should the mob despawn when leaving a players render distance? Server resetting seems to break this and make the mob not work properly. Recommended to keep this to true.
    NoGravity: false #If true, the mob will not fall due to gravity. Set to true if you want a floating mob.
    PreventOtherDrops: false #if true, the mob will drop vanilla loot. If true, prevents unwanted drops.
    Baby: false #Whether the mob spawns as a baby or not. Baby mobs are faster and harder to hit.
    Size: 4 #Increase size for magma cubes, phantoms, or slimes. Vanilla default is 4 for slimes and magma cubes, 1 for phantoms.
  BossBar:
    Enabled: true
    Title: '&3Template Bossbar'
    Range: 50
    Color: GREEN
    Style: SOLID
  DamageModifiers: #Common damage modifiers to make mobs weak or resistant to certain damage types. Increase over 1 to make them take more damage, make it less than 0.99 to make them resistant to damage type.
  - FALL 0.5 #0.5 = 50% damage reduction from falling
  - POISON 2 #Take 2x more damage from poison
  - MAGIC 1 #Damage taken from Instant damage or instant healing potion
  - FIRE_TICK 1 #Damage from burning
  - LAVA 1 #Damage taken from being inside lava
  - FIRE 1 #Damage taken from being inside a fire block
  - SONIC_BOOM 1 #Damage taken from a warden's sonic boom attack
  - WITHER 1 #Damage taken from wither effect.
  Drops:
  - iron_ingot 1-5 0.5 #Mob has a 50% chance to drop between 1 and 5 iron ingots on death. Delete this line or change it to another item if you don't want this.
  - exp 3 #By default, normal mobs drop 3 EXP. Increase for a greater reward for enchantment levels.
  Skills:
  - damage{a=7;type=PHYSICAL} @target ~onAttack 0.8


