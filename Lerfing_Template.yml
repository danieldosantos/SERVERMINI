  - potion{t=RESISTANCE;d=200;lvl=1} @self ~onTimer:200
  # Partículas celestiais
  - effect:particles{particle=totem_of_undying;amount=12;hS=0.4;vS=0.4;speed=0.05} @self ~onTimer:40

