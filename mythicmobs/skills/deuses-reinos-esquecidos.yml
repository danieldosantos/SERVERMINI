    - potion{type=RESISTANCE;duration=200;lvl=2} @self
    - potion{type=ABSORPTION;duration=200;lvl=3} @self
    - effect:particles{p=enchanted_hit;amount=40;hS=0.6;vS=0.4;speed=0.1} @self

