DivineElementalFury:
  Skills:
    - effect:lightning @PlayersInRadius{r=12}
    - damage{amount=45;cause=magic;ignoreArmor=true} @PlayersInRadius{r=12}
    - ignite{ticks=160} @PlayersInRadius{r=12}
    - potion{type=SLOW;duration=140;lvl=1} @PlayersInRadius{r=12}
    - effect:particles{p=dragon_breath;amount=60;hS=1.2;vS=1;speed=0.25} @self

DivineMythicAura:
  Skills:
    - potion{type=INCREASE_DAMAGE;duration=260;lvl=3} @self
    - potion{type=RESISTANCE;duration=240;lvl=2} @self
    - potion{type=SPEED;duration=200;lvl=2} @self
    - potion{type=REGENERATION;duration=200;lvl=1} @self
    - effect:particles{p=totem_of_undying;amount=45;hS=0.8;vS=0.7;speed=0.15} @self

DivineCripplingWave:
  Skills:
    - knockback{velocity=1.2} @PlayersInRadius{r=10}
    - damage{amount=38;cause=magic;ignoreArmor=true} @PlayersInRadius{r=10}
    - potion{type=WEAKNESS;duration=180;lvl=2} @PlayersInRadius{r=10}
    - potion{type=SLOW;duration=160;lvl=2} @PlayersInRadius{r=10}
    - effect:particles{p=enchanted_hit;amount=55;hS=1;vS=0.8;speed=0.15} @self
