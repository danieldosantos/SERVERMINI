DeidadeEgipciaBase:
  Type: WITHER_SKELETON
  Display: '&6&l{display}'
  Health: 2000
  Damage: 25
  Armor: 12
  KnockbackResistance: 1
  Faction: DeusesEgipcios
  Options:
    AlwaysShowName: true
    PreventLeashing: true
    PreventRenaming: true
    Despawn: false
    Silent: true
  AIGoalSelectors:
    - clear
    - meleeattack{speed=1.4;range=2.5}
    - randomstroll
    - lookatplayers
  TargetSelectors:
    - clear
    - players
    - mobs{faction!=DeusesEgipcios}
  Modules:
    ThreatTable: true
  Skills:
    - skill{s=GodlyShield} @self ~onSpawn
    - skill{s=GodlySmite} @target ~onTimer:100 1
    - skill{s=GodlyHeal} @self ~onDamaged 0.35

ReHorakhty:
  Inherit: DeidadeEgipciaBase
  Display: 'Re-Horakhty, Senhor do Sol'
  Health: 2350
  Skills:
    - skill{s=DomainSolarFlare} @PlayersInRadius{r=11} ~onTimer:120 1
    - skill{s=DomainSunriseBlessing} @self ~onTimer:170 1

