DeidadeGregaBase:
  Type: WITHER_SKELETON
  Display: '&6&l{display}'
  Health: 2000
  Damage: 25
  Armor: 12
  KnockbackResistance: 1
  Faction: DeusesGregos
  Options:
    AlwaysShowName: true
    PreventLeashing: true
    PreventRenaming: true
    Despawn: false
    Silent: true
  AIGoalSelectors:
    - clear
    - meleeattack{speed=1.4;range=2.5}
    - randomstroll
    - lookatplayers
  TargetSelectors:
    - clear
    - players
    - mobs{faction!=DeusesGregos}
  Modules:
    ThreatTable: true
  Skills:
    - skill{s=GodlyShield} @self ~onSpawn
    - skill{s=GodlySmite} @target ~onTimer:100 1
    - skill{s=GodlyHeal} @self ~onDamaged 0.35

Zeus:
  Inherit: DeidadeGregaBase
  Display: 'Zeus, Senhor dos Céus'
  Health: 2400
  Skills:
    - skill{s=DomainThunderWrath} @PlayersInRadius{r=12} ~onTimer:110 1
    - skill{s=DomainSkyCommand} @PlayersInRadius{r=10} ~onTimer:160 1

