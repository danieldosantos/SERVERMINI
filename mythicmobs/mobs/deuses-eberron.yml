DeidadeEberronBase:
  Type: WITHER_SKELETON
  Display: '&6&l{display}'
  Health: 2600
  Damage: 40
  Armor: 16
  KnockbackResistance: 1
  Faction: DeusesEberron
  Options:
    AlwaysShowName: true
    PreventLeashing: true
    PreventRenaming: true
    Despawn: false
    Silent: true
  AIGoalSelectors:
    - clear
    - meleeattack{speed=1.4;range=2.5}
    - randomstroll
    - lookatplayers
  TargetSelectors:
    - clear
    - players
    - mobs{faction!=DeusesEberron}
  Modules:
    ThreatTable: true
  Skills:
    - skill{s=GodlyShield} @self ~onSpawn
    - skill{s=GodlySmite} @target ~onTimer:100 1
    - skill{s=GodlyHeal} @self ~onDamaged 0.35
    - skill{s=DivineElementalFury} @PlayersInRadius{r=12} ~onTimer:140 1
    - skill{s=DivineMythicAura} @self ~onTimer:120 1
    - skill{s=DivineCripplingWave} @PlayersInRadius{r=10} ~onTimer:180 1

