DeidadeNaoHumanaBase:
  Type: WITHER_SKELETON
  Display: '&6&l{display}'
  Health: 2000
  Damage: 25
  Armor: 12
  KnockbackResistance: 1
  Faction: DeusesNaoHumanos
  Options:
    AlwaysShowName: true
    PreventLeashing: true
    PreventRenaming: true
    Despawn: false
    Silent: true
  AIGoalSelectors:
    - clear
    - meleeattack{speed=1.4;range=2.5}
    - randomstroll
    - lookatplayers
  TargetSelectors:
    - clear
    - players
    - mobs{faction!=DeusesNaoHumanos}
  Modules:
    ThreatTable: true
  Skills:
    - skill{s=GodlyShield} @self ~onSpawn
    - skill{s=GodlySmite} @target ~onTimer:100 1
    - skill{s=GodlyHeal} @self ~onDamaged 0.35

