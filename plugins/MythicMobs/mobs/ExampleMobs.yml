MM_SUCCUBUS:
  Type: VEX
  Display: '&dSúcubo'
  Health: 72
  Damage: 6
  Faction: fiend

  Options:
    MovementSpeed: 0.40
    FollowRange: 24
    PreventOtherDrops: true
    PreventRandomEquipment: true
    Silent: false
    Despawn: false

  DamageModifiers:
    # Resistências infernais
    - FIRE 0.5
    - COLD 0.5
    - LIGHTNING 0.5
    - POISON 0.5
    - BLUDGEONING 0.6
    - PIERCING 0.6
    - SLASHING 0.6
    # Fraqueza a dano sagrado
    - HOLY 1.25

  Skills:
    # Garras – ataque físico básico
    - damage{a=7;type=SLASHING} @target ~onAttack 1

    # ENFEITIÇAR – charm mental (confusão e fraqueza)
    - potion{t=WEAKNESS;d=160;lvl=1} @target ~onAttack 0.45
    - potion{t=CONFUSION;d=120;lvl=0} @target ~onAttack 0.4
    - potion{t=BLINDNESS;d=80;lvl=0} @target ~onAttack 0.25

    # Visão e Marca da Alma – marca a vítima “ligada” a ela
    - potion{t=GLOWING;d=200;lvl=0} @NearestPlayer{r=18} ~onTimer:200 0.6

    # BEIJO DRENADOR – dano psíquico + cura (golpe de execução)
    - damage{a=24;type=PSYCHIC} @target ~onAttack 0.25
    - heal{a=12} @self ~onAttack 0.25

    # FORMA ETÉREA – some e se reposiciona
    - potion{t=INVISIBILITY;d=100;lvl=1;overwrite=true} @self ~onTimer:160 0.7
    - leap{v=1.4;yi=0.9} @self ~onTimer:160 0.7

    # Sussurros Corruptores – enfraquece a mente em área
    - potion{t=SLOW;d=100;lvl=1} @PlayersInRadius{r=10} ~onTimer:200 0.5
    - potion{t=HUNGER;d=140;lvl=0} @PlayersInRadius{r=10} ~onTimer:200 0.4

    # Retirada Elegante – foge quando apanha muito
    - leap{v=1.8;yi=1.0} @self ~onDamaged 0.5
    - potion{t=INVISIBILITY;d=80;lvl=1;overwrite=true} @self ~onDamaged 0.5

    # Chamado Infernal – chance de chamar um aliado demoníaco
    - summon{type=MM_RAKSHASA;amount=1;radius=4} @self ~onKill 0.25


MM_INCUBUS:
  Type: VEX
