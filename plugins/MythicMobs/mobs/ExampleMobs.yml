    - PIERCING 0.6
    - SLASHING 0.6
    # Fraqueza a dano sagrado
    - HOLY 1.25

  Skills:
    # Espada/Garra infernal – ataque corpo a corpo mais agressivo
    - damage{a=10;type=SLASHING} @target ~onAttack 1

    # Domínio da Vontade – enfraquece a mente e a defesa do alvo
    - potion{t=WEAKNESS;d=160;lvl=1} @target ~onAttack 0.4
    - potion{t=SLOW;d=120;lvl=1} @target ~onAttack 0.35

    # Marca do Tentador – destaca o alvo principal
    - potion{t=GLOWING;d=160;lvl=0} @NearestPlayer{r=18} ~onTimer:180 0.6

    # BEIJO DRENADOR – dano psíquico + roubo de vida
    - damage{a=26;type=PSYCHIC} @target ~onAttack 0.3
    - heal{a=14} @self ~onAttack 0.3

    # Fúria Infernal – ataque em área em momento aleatório
    - damage{a=8;type=FIRE} @PlayersInRadius{r=4} ~onTimer:200 0.5
    - potion{t=CONFUSION;d=80;lvl=0} @PlayersInRadius{r=4} ~onTimer:200 0.4

    # Passo Etéreo – “teleporta” reposicionando com invisibilidade
    - potion{t=INVISIBILITY;d=80;lvl=1;overwrite=true} @self ~onTimer:140 0.6
    - leap{v=1.6;yi=1.0} @self ~onTimer:140 0.6

    # Retirada Sombria – fuga quando está em perigo
    - leap{v=2.0;yi=1.1} @self ~onDamaged 0.5
    - potion{t=INVISIBILITY;d=60;lvl=1;overwrite=true} @self ~onDamaged 0.5

    # Chamado das Profundezas – pode chamar demônios aliados
    - summon{type=MM_RAKSHASA;amount=1;radius=4} @self ~onKill 0.2

MM_TARRASQUE:
  Type: RAVAGER
  Display: '&c&lTarrasque'
  Health: 1200
  Damage: 40
  Faction: titan

  Options:
    MovementSpeed: 0.36
    FollowRange: 40
    PreventOtherDrops: true
    PreventRandomEquipment: true
    Despawn: false
    KnockbackResistance: 1.0
    AlwaysShowName: true

  DamageModifiers:
    # Imunidades principais
    - FIRE 0.0
    - POISON 0.0
    - MAGIC 0.5       # forte resistência mágica geral
    # Resistência brutal a dano físico
    - BLUDGEONING 0.3
    - PIERCING 0.3
    - SLASHING 0.3
    # Explosões um pouco reduzidas
    - EXPLOSION 0.5

  Skills:
    # ===========================
    # ATAQUES PRINCIPAIS
    # ===========================

    # Mordida – dano altíssimo em corpo a corpo
    - damage{a=50;type=PIERCING} @target ~onAttack 1

    # Garras – dano em área frontal (multi-ataques “garras”)
    - cone{radius=5;angle=90;ys=0;ye=3;hnp=false;hnp=true;skill=[
        damage{a=32;type=SLASHING} @EntitiesInCone{}
      ]} @self ~onAttack 0.6

    # Chifres – ataque de impacto que lança o alvo pra trás
    - damage{a=38;type=PIERCING} @target ~onAttack 0.4
    - throw{v=1.5;vy=0.6} @target ~onAttack 0.4

    # Cauda – golpe em área atrás dele
    - radius{r=6;os=180;oe=360;skill=[
        damage{a=28;type=BLUDGEONING} @EntitiesInRadius{}
        ;potion{t=SLOW;d=100;lvl=1} @EntitiesInRadius{}
      ]} @self ~onTimer:80 0.7

    # ===========================
    # PRESENÇA ATERRADORA
    # ===========================
    # Medo em área, simulando o teste de Sabedoria
    - potion{t=CONFUSION;d=120;lvl=0} @PlayersInRadius{r=20} ~onTimer:160 0.6
    - potion{t=WEAKNESS;d=160;lvl=1} @PlayersInRadius{r=20} ~onTimer:160 0.6
    - potion{t=SLOW;d=120;lvl=1} @PlayersInRadius{r=20} ~onTimer:160 0.5

    # ===========================
    # ENGOLIR (VERSÃO SIMPLIFICADA)
    # ===========================
    # “Engole” o alvo: grande dano + dano ácido contínuo
    - damage{a=45;type=PIERCING} @target ~onAttack 0.3
    - repeat{amount=6;delay=20;skills=[
        damage{a=12;type=ACID} @target
      ]} @target ~onAttack 0.3

    # ===========================
    # CARAPAÇA REFLEXIVA (ANTI-MAGIA)
    # ===========================
    # Chance de “anular” parte do dano à distância / mágico
    - skill{s=MM_TARRASQUE_REFLECT} @self ~onDamaged 0.4

    # ===========================
    # RESISTÊNCIA LENDÁRIA
    # ===========================
    # Se tomar muito dano de uma vez, se “cura” parcialmente
    - healpercent{p=8} @self ~onDamaged 0.25

    # ===========================
    # MONSTRO DE CERCO (VERSÃO SIMPLES)
    # ===========================
    # Passadas sísmicas causando dano em volta (ideal perto de construções)
    - effect:explosion @self ~onTimer:120 0.5
    - damage{a=18;type=BLUDGEONING} @PlayersInRadius{r=6} ~onTimer:120 0.5

