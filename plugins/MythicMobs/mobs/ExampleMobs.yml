    # GARRAS – dano em área frontal curta (simula dois ataques de garra)
    - cone{radius=5;angle=70;ys=0;ye=3;hnp=false;skill=[
        damage{a=20;type=SLASHING} @EntitiesInCone{}
      ]} @self ~onAttack 0.6

    # Cauda – grande impacto atrás, com knockback
    - radius{r=6;os=150;oe=210;skill=[
        damage{a=26;type=BLUDGEONING} @EntitiesInRadius{}
        ;throw{v=1.4;vy=0.6} @EntitiesInRadius{}
      ]} @self ~onTimer:80 0.7

    # ===========================
    # SOPRO DE VAPOR (RECARREGA)
    # ===========================
    # Versão simplificada: cone de fogo/“vapor” na frente
    - cone{radius=12;angle=80;ys=0;ye=4;hnp=false;skill=[
        damage{a=34;type=FIRE} @EntitiesInCone{}
        ;potion{t=SLOW;d=120;lvl=1} @EntitiesInCone{}
      ]} @self ~onTimer:200 0.7

    # ===========================
    # PODER DO TITÃ DOS MARES
    # ===========================
    # Ondas sísmicas – dano em área ao redor (bom contra construções/jogadores)
    - effect:explosion @self ~onTimer:140 0.5
    - damage{a=16;type=BLUDGEONING} @PlayersInRadius{r=7} ~onTimer:140 0.5

    # Ira das Profundezas – fica mais perigosa quando perde muita vida
    - skill{s=MM_DRAGON_TURTLE_ENRAGE} @self ~onDamaged 0.25

