# Manual dos Monstros (auto-gerado)
MM_AARAKOCRA:
  Type: PHANTOM
  Display: 'Aarakocra'
  Health: 13
  Damage: 4
  Faction: fey
  Options:
    MovementSpeed: 0.5  # voo 15 m
    FollowRange: 28
    PreventOtherDrops: true
    NoGravity: true
    Silent: false
  Equipment:
  - STONE_SWORD HAND
  - STONE_SWORD OFFHAND
  Skills:
  # Talões: dano leve em mergulho
  - damage{a=4;type=PHYSICAL} @target ~onAttack 0.8
  - damage{a=2;type=PHYSICAL} @target ~onAttack{conditions=[inair{}]} 0.6
  # Voo de reconhecimento: rapidez temporária
  - potion{t=SPEED;d=120;lvl=1} @self ~onTimer:200 0.5
  # Convocação simples de elemental do ar (1/dia)
  - summon{type=MM_ELEMENTAL_DO_AR;amount=1;radius=3;yo=0} @self ~onTimer:2400 0.15
  - effect:particles{particle=cloud;amount=10;hS=0.5;vS=0.2;speed=0.1} @self ~onTimer:40

MM_ABOCANHADORMATRAQUEANTE:
  Type: SLIME
  Display: 'Abocanhador Matraqueante'
  Health: 67
  Damage: 11
  Faction: aberration
  Options:
    MovementSpeed: 0.12  # 3 m em D&D
    FollowRange: 20
    PreventOtherDrops: true
    Silent: false
  Skills:
  # Solo Aberrante: terreno difícil e prende
  - potion{t=SLOW;d=60;lvl=1} @PlayersInRadius{r=3} ~onTimer:20
  - root{d=20} @PlayersInRadius{r=3} ~onTimer:40 0.25
  # Tagarelice: confusão leve em quem ouve
  - potion{t=CONFUSION;d=60;lvl=0} @PlayersInRadius{r=6} ~onTimer:60 0.4
  # Cusparada Cegante (recarrega 5–6 ~ chance)
  - projectile{bullet=SmallFireball;onhit=[potion{t=BLINDNESS;d=60;lvl=0} @PlayersInRadius{r=2};damage{a=2} @PlayersInRadius{r=2}]} @target ~onTimer:120 0.35
  # Mordida forte com chance de derrubar
  - damage{a=17} @target ~onAttack 0.7
  - potion{t=SLOW;d=40;lvl=1} @target ~onAttack 0.3

MM_ABOLETE:
  Type: ELDER_GUARDIAN
  Display: 'Abolete'
  Health: 135
  Damage: 12
  Faction: aberration
  Options:
    MovementSpeed: 0.12  # 3 m em terra; nade melhorado pela skill abaixo
    FollowRange: 24
    PreventOtherDrops: true
    Silent: false
  Skills:
  # Nadar rápido quando na água (simulação: boost de velocidade)
  - potion{t=DOLPHINS_GRACE;d=120;lvl=1} @self ~onTimer:80
  # Nuvem Mucosa: quem toca recebe doença (veneno curto)
  - potion{t=POISON;d=100;lvl=0} @PlayersInRadius{r=2} ~onDamaged 0.7
  # Tentáculo: dano adicional e debuff de cura em alvos
  - damage{a=12} @target ~onAttack 0.7
  - potion{t=HUNGER;d=200;lvl=0} @target ~onAttack 0.5
  # Cauda: golpe pesado ocasional
  - damage{a=15} @target ~onTimer:80 0.4
  # Escravizar: confusão/controle em área moderada
  - potion{t=CONFUSION;d=120;lvl=0} @PlayersInRadius{r=9} ~onTimer:200 0.3
  # Dreno Psíquico: dano psíquico e cura
  - damage{a=10;type=PSIONIC} @PlayersInRadius{r=8} ~onTimer:160 0.25
  - heal{amount=10} @self ~onTimer:160 0.25
  # Covil: puxão aquático (simples) e lentidão em terreno molhado
  - pull{v=1} @PlayersInRadius{r=6} ~onTimer:120 0.3
  - potion{t=SLOW;d=60;lvl=1} @PlayersInRadius{r=6} ~onTimer:120 0.3

MM_DEVA:
  Type: ALLAY
  Display: 'Deva'
  Health: 136
  Damage: 12
  Faction: celestial
  Options:
    MovementSpeed: 0.5  # Voo 27 m → ~1.08; limitando para equilíbrio
    FollowRange: 24
    PreventOtherDrops: true
    NoGravity: true
    Silent: false
  Equipment:
  - IRON_SWORD HAND
  Skills:
  # Ataques mágicos: dano radiante extra
  - damage{a=18;type=RADIANT} @target ~onAttack 0.9
  # Ataques múltiplos: chance de golpe duplo rápido
  - repeat{amount=1;delay=2;skills=[damage{a=7;type=PHYSICAL} @target]} @self ~onAttack 0.6
  # Toque Curativo (3x por vida)
  - healpercent{p=20} @self ~onDamaged{c=healthbelow{p=60}} 0.3
  - cleanse @self ~onDamaged{c=healthbelow{p=60}} 0.3
  # Aura protetora: resistência leve
  - potion{t=RESISTANCE;d=120;lvl=0} @self ~onTimer:200
  # Aparição celestial: partículas
  - effect:particles{particle=totem_of_undying;amount=10;hS=0.5;vS=0.5;speed=0.1} @self ~onTimer:40

