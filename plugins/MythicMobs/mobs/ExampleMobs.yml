    # TELEPORTE TÁTICO
    # ===========================
    # “Ataca e some”
    - teleport{radius=10} @self ~onAttack 0.4
    - teleport{radius=12} @self ~onDamaged 0.5
    - teleport{radius=15} @self ~onTimer:220 0.3

    # ===========================
    # “ATAQUE AÉREO”
    # ===========================
    # Se tiver alvo longe, ele mergulha
    - leap{v=1.4;yi=0.8} @self ~onTimer:120 0.5

    # ===========================
    # INVOCAR YUGOLOTH (VARIAÇÃO DO LIVRO)
    # Nycaloth – 50% de chance de chamar 1d4 mezzoloths ou 1 nycaloth
    # ===========================
    # Aproxima: 25% chance mezzoloth / 20% nycaloth numa janela longa
    - summon{type=MM_MEZZOLOTH;amount=2to4;radius=6} @self ~onTimer:800 0.25
    - summon{type=MM_NYCALOTH;amount=1;radius=6} @self ~onTimer:900 0.20



MM_ULTROLOTH:
  Type: ILLUSIONER
  Display: '&5&lUltroloth'
  Health: 260
  Damage: 12
  Faction: yugoloth

  Options:
    MovementSpeed: 0.36
    FollowRange: 30
    PreventOtherDrops: true
    PreventRandomEquipment: true
    Despawn: false
    Silent: false
    AlwaysShowName: true
    KnockbackResistance: 0.5

  DamageModifiers:
    - FIRE 0.5
    - FREEZE 0.5
    - POISON 0.0        # imune a veneno
    - WITHER 0.0
    - MAGIC 0.6
    - PROJECTILE 0.8
    - BLUDGEONING 0.8
    - SLASHING 0.8
    - PIERCING 0.8

  Skills:
    # ===========================
    # ESPADA LONGA / CORPO-A-CORPO
    # ===========================
    - damage{a=13;type=SLASHING} @target ~onAttack 0.9
    - damage{a=6;type=FIRE} @target ~onAttack 0.4

    # Buff marcial (simula ataques múltiplos mais perigosos)
    - potion{t=INCREASE_DAMAGE;d=80;lvl=1} @self ~onTimer:200 0.5

    # ===========================
    # OLHAR HIPNÓTICO
    # ===========================
    # Stun / confusão forte em alvo próximo
    - potion{t=SLOW;d=80;lvl=2} @NearestPlayer{r=10} ~onTimer:160 0.6
    - potion{t=BLINDNESS;d=60;lvl=0} @NearestPlayer{r=10} ~onTimer:160 0.6
    - potion{t=WEAKNESS;d=80;lvl=1} @NearestPlayer{r=10} ~onTimer:200 0.5

    # ===========================
    # MAGIAS INATAS
    # ===========================
    # Muralha de Fogo – dano em área
    - damage{a=16;type=FIRE} @PlayersInRadius{r=8} ~onTimer:220 0.6
    - ignite{ticks=100} @PlayersInRadius{r=8} ~onTimer:220 0.6

    # Tempestade de Fogo – burst pesado mais raro
    - damage{a=26;type=FIRE} @PlayersInRadius{r=10} ~onTimer:360 0.4
    - ignite{ticks=140} @PlayersInRadius{r=10} ~onTimer:360 0.4

    # Medo / sugestão em massa (controle de grupo)
    - potion{t=SLOW;d=100;lvl=1} @PlayersInRadius{r=12} ~onTimer:260 0.5
    - potion{t=NAUSEA;d=100;lvl=0} @PlayersInRadius{r=12} ~onTimer:260 0.5

    # Invisibilidade / escape
    - potion{t=INVISIBILITY;d=80;lvl=0;overwrite=true} @self ~onTimer:240 0.5

    # Clarividência / “radar” (só flavor – speed & night vision)
    - potion{t=SPEED;d=120;lvl=1} @self ~onTimer:300 0.5
    - potion{t=NIGHT_VISION;d=300;lvl=0} @self ~onSpawn 1.0

    # ===========================
    # RESISTÊNCIA À MAGIA
    # ===========================
    - potion{t=DAMAGE_RESISTANCE;d=160;lvl=1} @self ~onTimer:200 0.8

    # ===========================
    # TELEPORTE DE COMANDANTE
    # ===========================
    - teleport{radius=10} @self ~onDamaged 0.5
    - teleport{radius=14} @self ~onTimer:220 0.4

    # ===========================
    # INVOCAR YUGOLOTH (VAR LIVRO)
    # Ultroloth – 50% chance de invocar:
    #   1d6 mezzoloths, 1d4 nycaloths ou 1 ultroloth
    # ===========================
    # Quebrei em 3 “slots” com chances menores:
    - summon{type=MM_MEZZOLOTH;amount=2to6;radius=6} @self ~onTimer:900 0.25
    - summon{type=MM_NYCALOTH;amount=1to3;radius=8} @self ~onTimer:1000 0.2
    - summon{type=MM_ULTROLOTH;amount=1;radius=10} @self ~onTimer:1300 0.15


