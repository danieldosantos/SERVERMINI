# ===== SUPERFÍCIE (NERFADO, MAS QUALQUER BIOMA) =====
DND_GOBLIN_COMMON_SURFACE:
  MobType: MM_GOBLIN
  Worlds: world
  Chance: 0.20               # menor que antes
  Priority: 10               # prioridade baixa
  Action: REPLACE
