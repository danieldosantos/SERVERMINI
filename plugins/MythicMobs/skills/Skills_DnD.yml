#######################################################
# GOBLINS - Skills baseadas no Livro do Jogador (D&D 5e)
#######################################################

# Cimitarra do Goblin (ataque único)
MM_GOBLIN_SCIMITAR:
  Skills:
    - damage{amount=5;type=SLASHING} @Target

# Arco curto do Goblin – disparo simples
MM_GOBLIN_ARCO_CURTO:
  Skills:
    - projectile{
        bulletType=ARROW;
        velocity=1.6;
        damage=5;
        hnp=true
      } @Target

# Escapada Ágil (tanto goblin comum quanto chefe usam)
# Representa Desengajar/Esconder como ação bônus:
# speed + pequena "sumida" rápida.
MM_GOBLIN_ESCAPADA_AGIL:
  Skills:
    - potion{t=SPEED;d=40;lvl=1} @Self
    - potion{t=INVISIBILITY;d=20;lvl=0} @Self
    - leap{v=0.7} @Self
    - message{m="&7O goblin some nas sombras!";cooldown=40} @PlayersInRadius{r=12}

#######################################################
# Chefe Goblin
#######################################################

# Ataques múltiplos de cimitarra (como na ficha)
MM_CHEFE_GOBLIN_SCIMITAR_MULTI:
  Skills:
    - damage{amount=5;type=SLASHING} @Target
    - delay 5
    - damage{amount=3;type=SLASHING} @Target

# Azagaia – ataque perfurante à distância
MM_CHEFE_GOBLIN_AZAGAIA:
  Skills:
    - projectile{
        bulletType=TRIDENT;
        velocity=1.4;
        damage=5;
        hnp=true
      } @Target

# Redirecionar Ataque (versão simplificada):
# ele "salta" para o lado, simulando trocar de lugar com outro goblin.
MM_CHEFE_GOBLIN_REDIRECIONAR:
  Skills:
    - teleport{spread=2;radius=3} @Self
    - message{m="&8O chefe goblin se esconde atrás de outro goblin!";cooldown=40} @PlayersInRadius{r=12}
