KT_SUNLIGHT_WEAKNESS:
  Conditions:
    - daytime true
    - outside true
  Skills:
    - potion{type=SLOW;duration=80;level=0} @Self
    - potion{type=WEAKNESS;duration=80;level=0} @Self


