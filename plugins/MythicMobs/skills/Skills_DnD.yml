#########################
#        GNOLLS         #
#########################

# ------------------------------------------------
# Mordida de Frenesi — habilidade comum a todos
# ------------------------------------------------
GNOLL_FRENZY_BITE:
  Cooldown: 80
  Skills:
    - effect:particles{p=crit;amount=20;hS=0.4;vS=0.4;speed=0.15} @Target
    - effect:sound{s=entity.wolf.growl;v=1;p=0.9} @Self
    - effect:particles{p=reddust;color=255,50,50;size=1.2;amount=12} @Target
    - damage{amount=5;type=PIERCING} @Target



# ------------------------------------------------
# Uivo de Matilha — usado SOMENTE pelo LÍDER
# Chama reforços de gnolls comuns
# ------------------------------------------------
GNOLL_PACK_HOWL:
  Cooldown: 220
  Skills:
    # Efeito visual de grito
    - effect:particles{p=angry_villager;amount=30;hS=1.1;vS=0.6;speed=0.1} @Self
    - effect:particles{p=smoke;amount=18;hS=1;vS=0.5;speed=0.04} @Self

    # Som de uivo
    - effect:sound{s=entity.wolf.howl;v=1;p=0.9} @Self

    # Reforços
    - summon{mob=MM_GNOLL;amount=2;radius=4} @Self
    - delay 10
    - summon{mob=MM_GNOLL;amount=1;radius=6} @Self



# ------------------------------------------------
# Chamado do Alfa — usado SOMENTE pela
# PRESA DE YEENOGHU
# Chama vários gnolls + chance de invocar 1 líder
# ------------------------------------------------
GNOLL_ALPHA_CALL:
  Cooldown: 260
  Skills:
    # Aura demoníaca do chamado
    - effect:particles{p=smoke;amount=40;hS=1.5;vS=0.6;speed=0.03} @Self
    - effect:particles{p=crit;amount=45;hS=1.2;vS=0.8;speed=0.2} @Self
    - effect:particles{p=reddust;color=180,0,0;size=1.3;amount=20} @Self

    # Uivo demoníaco
    - effect:sound{s=entity.wolf.howl;v=1.2;p=0.7} @Self

    # Reforços principais — gnolls comuns
    - summon{mob=MM_GNOLL;amount=3;radius=5} @Self
    - delay 10
    - summon{mob=MM_GNOLL;amount=2;radius=7} @Self

    # Chance de invocar UM líder
    - summon{mob=MM_GNOLL_LIDER_MATILHA;amount=1;radius=5} @Self 0.35
GNOLL_VILLAGE_DEN_SPAWN:
  Cooldown: 9999
  Skills:
    - summon{mob=MM_GNOLL;amount=7;radius=6} @Self
    - summon{mob=MM_GNOLL_LIDER_MATILHA;amount=2;radius=4} @Self

############################
#      BUGBEAR SKILLS      #
############################

# Maça estrela do bugbear padrão
BUGBEAR_MORNINGSTAR:
  Cooldown: 0
  Skills:
    - effect:particles{p=crit;amount=10;hS=0.3;vS=0.3;speed=0.1} @Target
    - effect:sound{s=entity.zombie.attack_iron_door;v=1;p=0.8} @Self
    - damage{amount=8;type=BLUDGEONING} @Target

# Azagaia (dano perfurante)
BUGBEAR_JAVELIN:
  Cooldown: 0
  Skills:
    - effect:particles{p=crit;amount=8;hS=0.2;vS=0.2;speed=0.15} @Target
    - effect:sound{s=entity.arrow.shoot;v=1;p=1} @Self
    - damage{amount=6;type=PIERCING} @Target

# Brutamontes – batida mais forte ocasional
BUGBEAR_BRUTE_HIT:
  Cooldown: 40
  Skills:
    - effect:particles{p=explosion;amount=6;hS=0.4;vS=0.2;speed=0.05} @Target
    - effect:sound{s=entity.iron_golem.attack;v=1.1;p=0.8} @Self
    - damage{amount=5;type=BLUDGEONING} @Target


# =========================
#  COMANDANTE BUGBEAR
# =========================

# Ataques múltiplos (2 pancadas)
BUGBEAR_COMMANDER_MULTI:
  Cooldown: 0
  Skills:
    - effect:particles{p=crit;amount=14;hS=0.4;vS=0.3;speed=0.15} @Target
    - effect:sound{s=entity.iron_golem.attack;v=1.2;p=0.8} @Self
    - damage{amount=10;type=BLUDGEONING} @Target
    - delay 5
    - effect:particles{p=crit;amount=10;hS=0.3;vS=0.3;speed=0.1} @Target
    - damage{amount=8;type=BLUDGEONING} @Target

# Azagaia melhorada do comandante
BUGBEAR_COMMANDER_JAVELIN:
  Cooldown: 0
  Skills:
    - effect:particles{p=crit;amount=10;hS=0.3;vS=0.3;speed=0.2} @Target
    - effect:sound{s=entity.arrow.shoot;v=1.1;p=1} @Self
    - damage{amount=7;type=PIERCING} @Target

# Coração de Hruggek – quando apanha, ganha resistência e fica mais perigoso
BUGBEAR_HRUGGEK_HEART:
  Cooldown: 120
  Skills:
    - effect:particles{p=smoke;amount=15;hS=0.5;vS=0.4;speed=0.02} @Self
    - effect:particles{p=angry_villager;amount=10;hS=0.4;vS=0.6;speed=0.1} @Self
    - effect:sound{s=entity.evoker.prepare_attack;v=1.2;p=0.6} @Self
    # Resistência temporária a dano
    - potion{type=DAMAGE_RESISTANCE;d=140;level=1} @Self
    # Pequeno buff de força
    - potion{type=INCREASE_DAMAGE;d=140;level=0} @Self


############################
#      KENKU SKILLS        #
############################

# Ataque de espada curta (1d6+DES ≈ 6 de dano)
KENKU_SHORTSWORD_STAB:
  Skills:
    - damage{amount=6;type=PIERCING} @Target
    - effect:particles{p=crit;amount=10;hS=0.3;vS=0.3;speed=0.1} @Target
    - effect:sound{s=entity.player.attack.sweep;v=1;p=1.2} @Self

# Arco curto – ataque à distância
KENKU_SHORTBOW_SHOT:
  Cooldown: 20
  Skills:
    - shoot{type=ARROW;velocity=1.7;damage=6;spread=0.1} @Target
    - effect:sound{s=entity.arrow.shoot;v=1;p=1.2} @Self

# Ataque Surpresa – dano extra quando pega a criatura “de surpresa”.
KENKU_AMBUSH_STRIKE:
  Cooldown: 80
  Conditions:
    # Só tenta usar se o alvo NÃO estiver em combate há muito tempo.
    - targetnotincombat true
  Skills:
    - damage{amount=7;type=PIERCING} @Target
    - effect:particles{p=crit;amount=22;hS=0.4;vS=0.4;speed=0.15} @Target
    - effect:sound{s=entity.player.attack.crit;v=1;p=1.3} @Self


############################
#       KOBOLD SKILLS      #
############################

# Ataque de adaga (1d4+2 → ~4 de dano)
KOBOLD_DAGGER_STAB:
  Skills:
    - damage{amount=4;type=PIERCING} @Target
    - effect:sound{s=entity.player.attack.sweep;v=1;p=1.2}

# Funda – ataque à distância
KOBOLD_SLING_SHOT:
  Cooldown: 30
  Skills:
    - shoot{type=SNOWBALL;velocity=1.6;damage=4;spread=0.12} @Target
    - effect:sound{s=entity.snowball.throw;v=1;p=1.2}

# Táticas de Matilha
# Dano bônus quando inimigo está em meio a kobolds
KOBOLD_PACK_TACTIC:
  Conditions:
    - nearbyentities{types=MM_KOBOLD,MM_KOBOLD_ALADO;radius=4;min=1}
  Skills:
    - damage{amount=3;type=PIERCING} @Target
    - effect:particles{p=crit;amount=10}

# Pedra jogada pelo kobold alado
KOBOLD_DROP_STONE:
  Cooldown: 25
  Skills:
    - shoot{type=SNOWBALL;velocity=2;damage=6;spread=0.1} @Target
    - effect:sound{s=entity.arrow.shoot;v=1;p=0.9}

# Ataque aéreo com adaga
KOBOLD_AERIAL_DAGGER:
  Skills:
    - damage{amount=5;type=PIERCING} @Target

# Sensibilidade à luz solar
KOBOLD_SUNLIGHT_SENS:
  Conditions:
    - daytime true
  Skills:
    - potion{type=SLOW;duration=60;level=0} @Self

