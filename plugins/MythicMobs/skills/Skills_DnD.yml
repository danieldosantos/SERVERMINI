########################################
# GOBLINS - SKILLS COM ANIMAÇÃO
########################################

# Cimitarra / espada – golpe rápido
GOBLIN_SCIMITAR_SLASH:
  Skills:
    - effect:particles{p=crit;amount=8;speed=0.25;hS=0.25;vS=0.25} @target
    - effect:sound{s=entity.player.attack.sweep;v=0.9;p=1.4} @self
    - damage{a=5;type=SLASHING} @target

# Arco curto – flecha com trilha de partículas
GOBLIN_SHORTBOW_SHOT:
  Skills:
    - effect:sound{s=entity.arrow.shoot;v=1;p=1.3} @self
    - projectile{bulletType=ARROW;velocity=2;onHit=GOBLIN_SHORTBOW_HIT}

GOBLIN_SHORTBOW_HIT:
  Skills:
    - effect:particles{p=crit;amount=10;speed=0.15;hS=0.3;vS=0.3} @target
    - damage{a=5;type=PIERCING} @target

# Escapada Ágil (para goblin comum) – fumacinha e pulo
GOBLIN_NIMBLE_ESCAPE:
  Skills:
    - effect:particles{p=cloud;amount=18;speed=0.1;hS=0.5;vS=0.15} @self
    - effect:particles{p=smoke;amount=10;speed=0.05;hS=0.4;vS=0.1} @self
    - effect:sound{s=entity.enderman.teleport;v=0.7;p=1.5} @self
    - leap{v=0.9} @self

# Ataque múltiplo do Chefe Goblin (2 golpes de cimitarra)
GOBLIN_BOSS_MULTIATTACK:
  Skills:
    - effect:particles{p=crit;amount=12;speed=0.3;hS=0.3;vS=0.3} @target
    - effect:sound{s=entity.player.attack.sweep;v=1;p=1.3} @self
    - damage{a=5;type=SLASHING} @target
    - delay 4
    - effect:particles{p=crit;amount=6;speed=0.2;hS=0.25;vS=0.25} @target
    - damage{a=3;type=SLASHING} @target

# Azagaia do chefe (curto alcance / média distância)
GOBLIN_BOSS_JAVELIN:
  Skills:
    - effect:sound{s=entity.arrow.shoot;v=0.9;p=0.9} @self
    - projectile{bulletType=ARROW;velocity=1.7;onHit=GOBLIN_BOSS_JAVELIN_HIT}

GOBLIN_BOSS_JAVELIN_HIT:
  Skills:
    - effect:particles{p=crit;amount=10;speed=0.2;hS=0.3;vS=0.3} @target
    - damage{a=5;type=PIERCING} @target

# Escapada Ágil “melhorada” do chefe (mais dramática)
GOBLIN_BOSS_ESCAPE:
  Skills:
    - effect:particles{p=cloud;amount=24;speed=0.15;hS=0.7;vS=0.2} @self
    - effect:particles{p=smoke;amount=14;speed=0.08;hS=0.6;vS=0.2} @self
    - effect:sound{s=entity.enderman.teleport;v=1;p=1.4} @self
    - leap{v=1.1} @self

# Redirecionar Ataque – troca de lugar “ninja”
GOBLIN_REDIRECT:
  Skills:
    - effect:particles{p=poof;amount=20;speed=0.1;hS=0.5;vS=0.3} @self
    - effect:sound{s=entity.enderman.teleport;v=1;p=1.6} @self
    # mecanicamente só teleporta um pouco, mas visualmente parece troca de lugar
    - teleport{radius=3} @self

